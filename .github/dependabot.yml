version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
    open-pull-requests-limit: 2
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /plexa_portal
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
    open-pull-requests-limit: 2
    groups:
      npm-runtime:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Remove these gates only after every installed plugin declares support
      # and the major upgrade passes maintenance/run-ci-local.sh.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
    open-pull-requests-limit: 2
    groups:
      python-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

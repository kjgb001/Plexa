name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      portal: ${{ steps.classify.outputs.portal }}
      server: ${{ steps.classify.outputs.server }}
      deployment: ${{ steps.classify.outputs.deployment }}
      docs: ${{ steps.classify.outputs.docs }}
      codeql_python: ${{ steps.classify.outputs.codeql_python }}
      codeql_javascript: ${{ steps.classify.outputs.codeql_javascript }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            maintenance/classify_ci_changes.py --all --github-output "$GITHUB_OUTPUT"
          else
            maintenance/classify_ci_changes.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          fi

  portal:
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plexa_portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: plexa_portal/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLEXA_CI_POSTGRES_IMAGE: postgres:17.10-bookworm@sha256:67870dc097790edf2bd6726658db995dcc830f799d41bb2b78ef07c9a2d5f010
      PLEXA_CI_POSTGRES_FALLBACK_IMAGE: public.ecr.aws/docker/library/postgres@sha256:67870dc097790edf2bd6726658db995dcc830f799d41bb2b78ef07c9a2d5f010
      PLEXA_DATABASE_URL: postgresql+asyncpg://plexa:plexa_ci_password@localhost:5432/plexa_test
      PLEXA_DATABASE_SYNC_URL: postgresql://plexa:plexa_ci_password@localhost:5432/plexa_test
      PLEXA_TEST_DATABASE_URL: postgresql+asyncpg://plexa:plexa_ci_password@localhost:5432/plexa_test
      PLEXA_TEST_DATABASE_SYNC_URL: postgresql://plexa:plexa_ci_password@localhost:5432/plexa_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          source maintenance/lib/common.sh
          maintenance_pull_image \
            "$PLEXA_CI_POSTGRES_IMAGE" \
            "$PLEXA_CI_POSTGRES_FALLBACK_IMAGE"
          docker run --detach --rm \
            --name plexa-ci-postgres \
            --env POSTGRES_DB=plexa_test \
            --env POSTGRES_USER=plexa \
            --env POSTGRES_PASSWORD=plexa_ci_password \
            --publish 127.0.0.1:5432:5432 \
            "$MAINTENANCE_PULLED_IMAGE" >/dev/null
          for _ in $(seq 1 30); do
            if docker exec plexa-ci-postgres pg_isready -U plexa -d plexa_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs plexa-ci-postgres >&2
          echo "PostgreSQL did not become ready within 60 seconds." >&2
          exit 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          checksum: 90b2f223fb69d19db49e117da601f64978593417988530aa733d456141b4bcbb
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen alembic -c plexa_server/alembic.ini upgrade head
      - run: uv run --frozen alembic -c plexa_server/alembic.ini downgrade 20260523_01
      - run: uv run --frozen python plexa_server/tests/migrations/verify_hardening_upgrade.py seed
      - run: uv run --frozen alembic -c plexa_server/alembic.ini upgrade head
      - run: uv run --frozen python plexa_server/tests/migrations/verify_hardening_upgrade.py verify
      - run: uv run --frozen pytest -q plexa_server/tests
      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force plexa-ci-postgres >/dev/null 2>&1 || true

  deployment:
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n deploy/*.sh deploy/lib/*.sh maintenance/*.sh maintenance/lib/*.sh
      - run: maintenance/audit-ci.sh
      - run: deploy/create-production-env.sh --local --model ci-model --output /tmp/plexa-local-production.env --force
      - run: deploy/check-production-config.sh /tmp/plexa-local-production.env
      - run: deploy/create-production-env.sh --domain plexa.example.test --email ci@example.org --inference-url https://inference.example.test/v1 --model ci-model --retention-days 30 --temporary-dev-login --admin-user ci-admin --output /tmp/plexa-domain-production.env --force
      - run: deploy/check-production-config.sh /tmp/plexa-domain-production.env

  required:
    name: Plexa CI
    if: always()
    needs: [changes, portal, server, deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PORTAL_SELECTED: ${{ needs.changes.outputs.portal }}
          PORTAL_RESULT: ${{ needs.portal.result }}
          SERVER_SELECTED: ${{ needs.changes.outputs.server }}
          SERVER_RESULT: ${{ needs.server.result }}
          DEPLOYMENT_SELECTED: ${{ needs.changes.outputs.deployment }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
        run: |
          set -euo pipefail
          failed=false
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            failed=true
          fi
          check_job() {
            local name="$1"
            local selected="$2"
            local result="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but did not succeed: $result" >&2
              failed=true
            elif [[ "$selected" != "true" && "$result" != "skipped" && "$result" != "success" ]]; then
              echo "$name had an unexpected result: $result" >&2
              failed=true
            fi
          }
          check_job portal "$PORTAL_SELECTED" "$PORTAL_RESULT"
          check_job server "$SERVER_SELECTED" "$SERVER_RESULT"
          check_job deployment "$DEPLOYMENT_SELECTED" "$DEPLOYMENT_RESULT"
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
          echo "All selected CI jobs succeeded."

services:
  postgres:
    image: postgres:17.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - plexa_postgres_data:/var/lib/postgresql/data
    mem_limit: 2g
    cpus: 2.0
    logging:
      options: {max-size: "10m", max-file: "5"}

  plexa_migrate:
    build:
      context: .
      dockerfile: plexa_server/Dockerfile
    restart: "no"
    env_file:
      - ${PLEXA_DEPLOY_ENV_FILE:-deploy/production.env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "plexa_server/alembic.ini", "upgrade", "head"]
    mem_limit: 512m
    cpus: 1.0
    logging:
      options: {max-size: "10m", max-file: "3"}

  plexa_server:
    build:
      context: .
      dockerfile: plexa_server/Dockerfile
    restart: unless-stopped
    env_file:
      - ${PLEXA_DEPLOY_ENV_FILE:-deploy/production.env}
    depends_on:
      postgres:
        condition: service_healthy
      plexa_migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    secrets:
      - inference_api_key
      - log_encryption_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0
    logging:
      options: {max-size: "10m", max-file: "5"}

  plexa_retention:
    build:
      context: .
      dockerfile: plexa_server/Dockerfile
    restart: unless-stopped
    env_file:
      - ${PLEXA_DEPLOY_ENV_FILE:-deploy/production.env}
    depends_on:
      plexa_migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "plexa_server.utils.cleanup_retention", "--loop"]
    mem_limit: 512m
    cpus: 0.5
    logging:
      options: {max-size: "10m", max-file: "3"}

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        TARGET_API_VERSION: ${TARGET_API_VERSION:-v1}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_ENABLE_DEV_LOGIN: ${VITE_ENABLE_DEV_LOGIN:-false}
        VITE_AUTH_AUTHORITY: ${VITE_AUTH_AUTHORITY:-}
        VITE_AUTH_DISCOVERY_URL: ${VITE_AUTH_DISCOVERY_URL:-}
        VITE_AUTH_CLIENT_ID: ${VITE_AUTH_CLIENT_ID:-}
        VITE_AUTH_SCOPE: ${VITE_AUTH_SCOPE:-openid profile email}
        VITE_AUTH_REDIRECT_URI: ${VITE_AUTH_REDIRECT_URI:-}
        VITE_AUTH_LOGOUT_REDIRECT_URI: ${VITE_AUTH_LOGOUT_REDIRECT_URI:-}
    restart: unless-stopped
    environment:
      PLEXA_SITE_ADDRESS: ${PLEXA_SITE_ADDRESS:?PLEXA_SITE_ADDRESS must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    depends_on:
      plexa_server:
        condition: service_healthy
    ports:
      - "${PLEXA_HTTP_PORT:-80}:80"
      - "${PLEXA_HTTPS_PORT:-443}:443"
    volumes:
      - plexa_caddy_data:/data
      - plexa_caddy_config:/config
    mem_limit: 512m
    cpus: 1.0
    logging:
      options: {max-size: "10m", max-file: "5"}

volumes:
  plexa_postgres_data:
  plexa_caddy_data:
  plexa_caddy_config:

secrets:
  inference_api_key:
    file: ${PLEXA_INFERENCE_API_KEY_HOST_FILE:?PLEXA_INFERENCE_API_KEY_HOST_FILE must be set}
  log_encryption_key:
    file: ${PLEXA_LOG_ENCRYPTION_KEY_HOST_FILE:?PLEXA_LOG_ENCRYPTION_KEY_HOST_FILE must be set}

[project]
name = "plexa"
version = "0.0.0"
description = "Open-source platform for instructor-authored, AI-supported lessons in higher education."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kellan Guinn-Bailey" },
]
keywords = ["artificial intelligence", "higher education", "learning technology"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic",
    "asyncpg",
    "cryptography",
    "fastapi",
    "httpx",
    "pydantic",
    "sqlalchemy",
    "uvicorn",
]

[project.urls]
Documentation = "https://kjgb001.github.io/Plexa/"
Issues = "https://github.com/kjgb001/Plexa/issues"
Repository = "https://github.com/kjgb001/Plexa"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-design",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["plexa_server*"]

[tool.pytest.ini_options]
markers = [
    "postgres_only: test requires the postgres storage backend",
]
